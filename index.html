<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кошачья Судьба</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg1:#fff7ed;
  --bg2:#fde68a;
  --card:#ffffffcc;
  --text:#1f2937;
  --accent:#f97316;
  --dark:#0f172a;
}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui, sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .6s,color .6s;
}
body.night{
  background:linear-gradient(135deg,#020617,#1e1b4b);
  color:#e5e7eb;
}
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:20px;
  padding:24px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}
body.night .card{background:#020617dd}
h1{margin:0 0 10px}
.input-wrap{
  display:flex;
  justify-content:center;
}
input{
  width:200px;
  padding:12px;
  font-size:18px;
  border-radius:12px;
  border:2px solid var(--accent);
  text-align:center;
}
input.shake{
  animation:shake .3s;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

button{
  margin-top:12px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:600;
}
.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin:16px 0;
}
.progress span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#f97316,#fb7185);
  transition:width .5s;
}
.aura{
  width:140px;
  height:140px;
  margin:16px auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
  position:relative;
}
.aura.god{animation:pulse 1.5s infinite;box-shadow:0 0 40px gold}
.aura.rare{box-shadow:0 0 30px violet}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.hidden{display:none}
.achievement{
  font-size:14px;
  margin-top:6px;
  color:#16a34a;
}
footer{
  margin-top:12px;
  font-size:12px;
  opacity:.7;
}
</style>
</head>

<body>
<div class="card">
<h1>🐈 Кошачья Судьба</h1>
<p>Узнай кем ты стал в мире котов</p>

<div class="input-wrap">
  <input id="age" type="number" min="1" max="1000" placeholder="Возраст (1–1000)">
</div>

<button onclick="calc()">Пробудить кота</button>

<div class="progress"><span id="bar"></span></div>

<div id="cat" class="aura hidden">🐱</div>
<p id="text"></p>
<p id="fate"></p>

<div id="ach" class="achievement hidden"></div>

<button id="rebirth" class="hidden" onclick="rebirth()">Переродиться</button>

<footer>⚠ Всё происходящее — шутка</footer>
</div>

<script>
const texts=[
{l:20,t:"Мяукающий хаос 🐾"},
{l:50,t:"Кот-исследователь диванов 😼"},
{l:100,t:"Серый кардинал кухни 😺"},
{l:200,t:"Хранитель подоконника 🪟"},
{l:400,t:"Повелитель коробок 📦"},
{l:600,t:"Мифический кот-отшельник 🌫"},
{l:800,t:"Космический кот наблюдатель 🌌"},
{l:1000,t:"Абсолютный кошачий архонт 🐈‍⬛"}
];

const fates=[
"Бродячий философ",
"Храмовый хранитель",
"Кибер-кот будущего",
"Кот-шпион",
"Кот-алхимик",
"Хроно-кот",
"Кот-император"
];

function calc(){
  const input=document.getElementById('age');
  let age=+input.value;
  if(!age||age>1000){
    input.classList.add('shake');
    setTimeout(()=>input.classList.remove('shake'),300);
    return;
  }

  document.body.classList.toggle('night',age>500);

  const catAge=age*5;
  document.getElementById('bar').style.width=Math.min(catAge/50,100)+'%';

  let text=texts.find(x=>catAge<x.l*5)?.t||texts.at(-1).t;
  document.getElementById('text').textContent=text;

  document.getElementById('fate').textContent=
    "Судьба: "+fates[Math.floor(Math.random()*fates.length)];

  const cat=document.getElementById('cat');
  cat.className="aura";
  cat.textContent=["🐱","😺","😼","🐈","🐈‍⬛"][Math.floor(Math.random()*5)];
  if(catAge>3000)cat.classList.add("god");
  if(Math.random()<0.05)cat.classList.add("rare");
  cat.classList.remove("hidden");

  checkAch(age);
  document.getElementById('rebirth').classList.remove('hidden');
}

function checkAch(age){
  const a=document.getElementById('ach');
  a.classList.remove('hidden');
  if([42,404,666,777].includes(age)){
    a.textContent="🏆 Секретное достижение разблокировано!";
  }else{
    a.textContent="";
  }
}

function rebirth(){
  localStorage.clear();
  location.reload();
}
</script>
</body>
</html>
